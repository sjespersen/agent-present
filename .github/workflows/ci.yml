name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Committed Pi bundle is up to date
        run: git diff --exit-code packages/pi/dist/index.js
      - name: Committed Claude Code bundle is up to date
        run: git diff --exit-code packages/claude-code/hooks/present.js
